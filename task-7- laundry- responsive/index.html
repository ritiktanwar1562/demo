<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <img src="images/logo.png" alt="Laundry Logo">
        </div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>

        <div class="username">
            <button>UserName</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-text">
            <h1>
                Revitalize Your <br>
                Clothes with Expert <br>
                <span>Laundry Services!</span>
            </h1>

            <p>
                From premium dry cleaning to soft wash and fold,
                we deliver care and convenience. Schedule a pickup
                and rediscover the freshness of your clothes today!
            </p>

            <button class="book-btn">
                Book a service today!
            </button>
        </div>

        <div class="hero-image">
            <img src="images/washing-machine.png" alt="Laundry Machine">
        </div>

    </section>

</body>
</html>
