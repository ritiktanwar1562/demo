<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="payment.html">Payment</a>
    </nav>
</header>

<div class="cart-page">

<div class="cart-left">
    <h1>Shopping Cart</h1>

    <table border="1">
        <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Remove</th>
        </tr>

        <tr>
            <td>Thala 7 Sneaker</td>
            <td>1</td>
            <td>₹1999</td>
            <td>X</td>
        </tr>
    </table>

    <a href="product.html">Continue Shopping</a>
</div>

<div class="cart-right">
    <h2>Order Summary</h2>

    <input type="text" placeholder="Coupon Code">
    <button>Apply</button>

    <p>Subtotal : ₹1999</p>
    <p>Tax : ₹100</p>
    <p>Discount : ₹200</p>
    <h3>Total : ₹1899</h3>

    <button>Pay Now</button>
</div>

</div>

</body>
</html>
