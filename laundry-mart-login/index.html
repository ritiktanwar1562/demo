<!DOCTYPE html>
<html>
<head>
    <title>Laundry Mart Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="left">
        <img src="image.jpg" alt="Laundry">
    </div>

    <div class="right">

        <form>
            <h2>Laundry Mart Login</h2>

            <label>Email</label>
            <input type="email" placeholder="Enter Email">

            <label>Password</label>
            <input type="password" placeholder="Enter Password">

            <button type="submit">Login</button>

        </form>

    </div>

</div>

</body>
</html>
