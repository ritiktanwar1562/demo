<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">

    <div class="left">

    <div class="right">

        </form>
    </div>

</div>

</body>
</html>
